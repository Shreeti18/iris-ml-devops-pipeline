
services:
  iris-api:
    build: .
    container_name: iris-ml-api
    ports:
      - "5003:5003"
    environment:
      MODEL_URI: /app/deployment_model
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: iris-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - iris-api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: iris-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-storage:
